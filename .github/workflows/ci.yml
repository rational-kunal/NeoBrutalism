name: "NeoBrutalism CI"

on:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Example/**"
      - ".github/workflows/**"
      - "Scripts/**"
      - "Package.swift"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Example/**"
      - ".github/workflows/**"
      - "Scripts/**"
      - "Package.swift"

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

# Refer https://github.com/Alamofire/Alamofire/blob/master/.github/workflows/ci.yml
jobs:
  iOS:
    name: "iOS Snapshot Tests"
    runs-on: macOS-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned snapshot environment
        run: |
          source Scripts/snapshot-env.sh
          echo "DEVELOPER_DIR=/Applications/$NB_CI_XCODE.app/Contents/Developer" >> "$GITHUB_ENV"

      # Component pages reference the snapshot references by name, so the
      # imagery has to exist for the DocC build to resolve them. This also
      # fails the PR if a manifest row points at a snapshot that no longer
      # exists (a renamed or deleted test).
      - name: Sync component imagery from snapshots
        run: Scripts/sync-doc-images.sh

      - name: Build documentation (DocC)
        run: |
          set -o pipefail
          xcodebuild docbuild -scheme NeoBrutalism -destination "generic/platform=iOS Simulator" 2>&1 | xcbeautify --renderer github-actions

      - name: Run tests and save result bundle
        run: |
          mkdir -p test_output
          set -o pipefail
          env NSUnbufferedIO=YES Scripts/test.sh \
            clean \
            -resultBundlePath "test_output/iOS-${{ github.run_id }}.xcresult" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO 2>&1 | xcbeautify --renderer github-actions

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures-${{ github.run_id }}
          path: test_output/**

  example-app:
    name: "Example app (build only)"
    runs-on: macOS-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned snapshot environment
        run: |
          source Scripts/snapshot-env.sh
          echo "DEVELOPER_DIR=/Applications/$NB_CI_XCODE.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build Example app
        run: |
          set -o pipefail
          cd Example
          xcodebuild \
            -scheme Example \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify --renderer github-actions
